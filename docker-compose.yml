services:
  postgres:
    image: timescale/timescaledb-ha:pg18
    # Preload pg_cron extension
    # https://github.com/timescale/timescaledb-docker-ha/issues/293
    command:
      - -cshared_preload_libraries=timescaledb,pg_cron
      - -ccron.database_name=postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - '5432:5432'
    volumes:
      # - ./pgdata:/home/postgres/pgdata
      - ./db/imports:/home/postgres/imports

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '8025:8025'
      - '1025:1025'

  rustfs:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-OSEMLOCAL}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-osem-local-secret-key}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  rustfs-init:
    image: rustfs/rc:v0.1.37
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-OSEMLOCAL}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-osem-local-secret-key}
      S3_BUCKET: ${S3_BUCKET:-images}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/rc alias set rustfs http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"; do
          echo 'Waiting for RustFS...'
          sleep 2
        done
        /usr/bin/rc ls "rustfs/$${S3_BUCKET}" >/dev/null 2>&1 || /usr/bin/rc mb "rustfs/$${S3_BUCKET}"
    restart: 'no'

volumes:
  rustfs-data:
